[pytest]

# 1.添加pytest的命令行选项
;[pytest_addopts] #这里添加的话，执行后不会打印print执行的内容
addopts = -v -s
# 2.添加测试路径
testpaths = script
# 3.添加测试文件
python_files = test*.py
# 4.添加测试类
python_classes = Test*
# 5.添加测试方法
python_functions = test*
;[report]
;output = report.html
;[html]
;title = My Test Report
;include = tests
;exclude =
;[markers]
;slow: marks tests as slow (deselect with '-m "not slow"')
;critical: marks tests as critical (deselect with '-m "not critical"')

